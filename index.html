          </div>

          <div class="stage-body">

              <span class="dot-live"></span>

            <p class="stage-sub" id="stage-sub">Choose from the library on the right, or hit Random for a surprise.</p>

              <button class="play-button" id="play-btn" onclick="playGame()" disabled>

              </button>
              <button class="btn-ghost" id="disk-btn" onclick="showDownloadedForSelected()" title="Manage downloaded builds">
                <span id="disk-label">On disk</span>
              </button>
            </div>
          </div>
        </section>

        <!-- ===================== LIBRARY ===================== -->
        <section class="library" id="library">

            <div class="library-title">
              <h2>Build Library</h2>

              <span class="mode-badge-key">MODE</span>
              <span class="mode-badge-val" id="mode-badge-text">BLOB</span>
            </button>
          </div>

            <div class="search-box">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>

            </div>
            <button class="upload-btn" onclick="pickCustomHtml()" title="Launch a local HTML file">

            </button>
